# scripts/product-health/WHITE_LABEL_PLACEHOLDERS.yaml
# TEMPLATE-VENDORED copy of the white-label placeholder vocabulary.
#
# Why this lives here (not only in the framework's core/registries): the product-health
# identity checks (fork-identity / deployment-whitelabel / store-listing / secrets-alias-
# namespace) run in the STANDALONE template checkout on CI (quality-gate.yml) and in every
# FORK — neither has the framework monorepo on disk, so the vocabulary MUST ship inside the
# template. lib.sh resolves this template-local copy first, then falls back to walking up to
# the framework's core/registries/WHITE_LABEL_PLACEHOLDERS.yaml in the monorepo dev tree.
#
# Authoring SoT: core/registries/WHITE_LABEL_PLACEHOLDERS.yaml (framework repo). Keep the two
# in sync — a new placeholder category/pattern is added there and re-vendored here.
version: 1
placeholders:
  bundle_id:
    - '^com\.example($|\.)'
    - '^YOUR_APP_ID$'
  app_display_name:
    - '^App Toolkit$'
    - '^YOUR_APP_NAME$'
  firebase_project_number:
    - '1:0{12}:'
    - 'YOUR_FIREBASE_PROJECT'
  apple_team_id:
    - '^CHANGEME$'
    - '^YOUR_TEAM_ID$'
    - '^$'
  apple_match_git_url:
    - 'YOUR_ORG/ios-provisioning'
    - '^CHANGEME$'
    - '^$'
  org_name:
    - '^Your Organization Name$'
    - '^App Toolkit$'
    - '^CHANGEME$'
    - '^$'
  store_copy_marker:
    - 'YOUR_[A-Z_]+'
    - '\bTODO\b'
    - '\bFIXME\b'
    - '\bPLACEHOLDER\b'
    - 'lorem ipsum'
    # Prose placeholders the neutral template ships for store copy (matched case-insensitively):
    # "Your App Name" / "Your App Tagline Here" / "Your app's one-line promotional pitch…" / "…Your Organization Name".
    - 'Your App'
    - "Your app's"
    - 'Your Organization'

# ── example_identity — the template's COMMITTED reference/demo identity ──────────────────
# The kmp-project-template ships as a WORKING Mifos "Money Toolkit" example (a real, deployable
# demo), NOT as neutral placeholders. Template-mode identity gates (fork-identity /
# deployment-whitelabel B1/B3/B7/B8 / store-listing / appid-consistency / ios-pbxproj-identity)
# ACCEPT exactly these reference values; a FORK must DIVERGE from them (a fork still shipping the
# Mifos reference → FAIL "rebrand your fork"). A value that is neither a placeholder NOR this
# reference is a foreign-brand leak on the template → FAIL.
# Signing categories (apple_team_id, apple_match_git_url) intentionally have NO example block —
# they stay placeholder-only on the template; real signing identity is injected at deploy time
# from the vault, never committed.
example_identity:
  bundle_id:
    - '^org\.mifos\.kmp\.template$'
  app_display_name:
    - '^Money Toolkit$'
  org_name:
    - '^Mifos Initiative$'
  # Store-copy reference strings the template ships (case-insensitive), consumed by B8/store-listing.
  store_copy_reference:
    - 'Money Toolkit'
    # 'Mifos Initiative' is deliberately EXCLUDED: unlike 'Money Toolkit' (a demo app name no real
    # fork carries), it is the genuine org/copyright text of every openMF Mifos-family fork, so
    # flagging it false-positives on every real Mifos app. 'org\.mifos\.kmp\.template' is anchored to
    # the template's FULL package (as bundle_id is): a bare 'org\.mifos' matched any real Mifos id.
    - 'org\.mifos\.kmp\.template'
