# Canary fixture target.
schema_version: "2.0"
target: web-demo
dual_mode: true
needs:
  - { secret: demo_token, required_for: ["auth"] }
  - { secret: demo_key, required_for: ["sign"] }

# >>> GENERATED by ./gradlew syncForkConfig from needs[] above + secrets/LAYOUT.yaml — do not hand-edit below this line
vault_aliases:
  - alias: canary-demo-token
    canonical: env:DEMO_TOKEN
    required_for: ["auth"]
    materialize: { format: "env", via: "export" }
  - alias: canary-demo-key
    canonical: "secrets/live/web/demo/key.json"
    required_for: ["sign"]
    materialize: { format: "file", via: "copy", mode: "0600" }

manual_inputs:
  - canonical: env:DEMO_TOKEN
    source_hint: "Demo console → API tokens"
    placeholder: "<demo-token>"
    gha_secret_var: "HAND_EDITED"
  - canonical: "secrets/live/web/demo/key.json"
    placeholder: "secrets/sample/web/demo/key.json"
    gha_secret_var: "DEMO_KEY"
