# Canary fixture — minimal LAYOUT (no values; names only).
version: 1
roots: { live: secrets/live, sample: secrets/sample }
precedence: [live, sample]
secrets:
  demo_token: { kind: env_var, source_env: DEMO_TOKEN, vault_alias: canary-demo-token, gha_secret: DEMO_TOKEN, hint: "Demo console → API tokens" }
  demo_key:
    vault_alias: canary-demo-key
    kind: file
    encoding: base64
    source_env: DEMO_KEY_B64
    gha_secret: NOT_READ_BY_CI
    rel: web/demo/key.json
    mode: "0600"
