store:
  primary_locale: en-US
  # REFERENCE store listing — the Mifos "Money Toolkit" working-example copy the template ships.
  # A fork MUST author its own (product-health store-listing / B8 warn while the Mifos reference
  # copy remains on a fork; on the template repo it is the intended committed state).
  title: 'Money Toolkit'                      # app display name (App Store name / Play title)
  subtitle: 'Loan Tracker & Finance Tools'    # short subtitle (App Store)
  promotional_text: 'Loans, EMI, bills, interest rates & currency — all offline. No login, no account, no ads. Free personal finance tools by Mifos Initiative.'
  description: 'Track your loans, calculate EMIs, set bill reminders, and watch live interest rates — all 100% offline. No login. No account. No internet required.\n\nMoney Toolkit is a free personal finance companion for everyday financial decisions. Every calculation happens on your device. Your data never leaves your phone.\n\n— TOOLS INCLUDED —\n\nLoan Tracker\nAdd and manage personal loans. Track principal, interest rate, EMI amount, and due date for every loan you owe — stored locally, fully private.\n\nEMI Calculator\nEnter any loan amount, annual interest rate, and tenure to get your monthly payment instantly. Works offline, no server call.\n\nAffordability Calculator\nKnow before you borrow. Enter your income and maximum monthly EMI to see the largest loan you can safely take on.\n\nBill Reminders\nSet recurring reminders for rent, electricity, subscriptions, and loan payments. Get notified before the due date — no cloud sync needed.\n\nAmortization Schedule\nSee the complete month-by-month repayment breakdown for any loan: principal paid, interest paid, and outstanding balance at every step.\n\nLoan Comparison\nEvaluating two loan offers? Compare total cost, monthly payment, and total interest side-by-side before you sign.\n\nInterest Rates\nLive US Federal Reserve benchmark rates — federal funds rate, mortgage rates, treasury yields — via the free FRED API. Requires a free FRED key (fred.stlouisfed.org); shows a clear empty state without one.\n\nCountry Macro Data\nGDP growth, inflation (CPI), and unemployment rates for countries worldwide from World Bank Open Data. No API key needed.\n\nCurrency Exchange Rates\nLive foreign exchange rates for any base currency — useful for travel, international transfers, or tracking money across borders.\n\n— WHY MONEY TOOLKIT —\n\nNo login or account — open the app and start immediately.\nWorks offline — calculators, loan tracking, and bill reminders need no internet.\nNo ads, no tracking, no analytics — your financial data stays on your device.\nNo subscription — free forever.\nOpen source — MIT licensed. Code available on GitHub.\n\nBuilt by the Mifos Initiative, a nonprofit with 15+ years of experience building financial tools for underserved communities worldwide.\n\nGitHub: https://github.com/openMF/kmp-project-template'
  release_notes: 'First release of Money Toolkit.\n\nIncludes: Loan Tracker, EMI Calculator, Affordability Calculator, Bill Reminders, Amortization Schedule, Loan Comparison, Live Interest Rates (FRED), Country Macro Indicators, and Currency Exchange Rates.\n\nEverything works offline. No account or login required.'
  copyright: 'Copyright © 2025 Mifos Initiative'
  age_rating: '4+'                            # iOS + macOS App Store age rating (store.ios.age.rating)
  review:
    notes: 'No login or account is required. All features work fully offline.\n\nApp features available for review:\n• Loan Tracker — add personal loans, track principal, EMI amounts, and due dates locally\n• EMI Calculator — compute monthly payments for any loan amount, rate, and tenure\n• Affordability Calculator — determine the maximum loan amount based on income and EMI budget\n• Bill Reminders — set recurring bill reminders with in-app notification scheduling\n• Amortization Schedule — view the full month-by-month payment breakdown for any loan\n• Loan Comparison — side-by-side total-cost comparison for up to two loan scenarios\n• Interest Rates — US Federal Reserve rate data (FRED API; a free key is needed for live data — the screen shows a clear empty state without it)\n• Country Macro Indicators — GDP, CPI, and unemployment data from World Bank Open Data (no key needed)\n• Currency Rates — live foreign exchange rates by base currency\n\nNo demo credentials are needed. No backend. No personal data is collected or transmitted. This is an open-source Kotlin Multiplatform reference implementation.'
    first_name: 'Mifos'                        # App Store review contact (mirrors org.first_name)
    last_name: 'Initiative'                    # App Store review contact (mirrors org.last_name)
    demo_user: ""                            # store.review.demo.user (blank — no login)
    demo_password: ""                        # store.review.demo.password
  app_description: Money Toolkit desktop     # desktop packaging description (app.description)

