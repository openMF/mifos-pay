# secrets/fork-layout.yaml — the fork's OWN secret rows (white-label, fork-owned).
#
# secrets/LAYOUT.yaml is template-owned and replaced on every sync, so a row a fork added there was
# deleted. Declare the fork's extra secrets here instead — same schema as LAYOUT.yaml#secrets — and
# deployment/_shared/lib/build_secrets.rb (the one resolver) adds them on top of the template's. A key
# LAYOUT.yaml already declares is ignored with a warning: a fork cannot redirect a template secret.
secrets:
  # mifos-pay's Supabase instance-config project ({url, anonKey}). Moved here from LAYOUT.yaml at the
  # 90ff6da6 template sync; read at build time by core/network/module-deps.gradle.kts, which generates
  # kpt.core.network.config.SupabaseCredentials (the template retired the plugin that used to).
  supabase_credentials:
    vault_alias: mifos-pay-supabase-credentials
    kind: file
    rel: supabase/supabaseCredentialsFile.json
    mode: "0600"
