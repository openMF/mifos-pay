# secrets/LAYOUT.yaml — SINGLE SOURCE OF TRUTH for the secrets *layout/contract*.
#
# This is the ONLY place the on-disk secrets structure is declared. Every reader
# (config.rb, Fastlane lanes, firebase_helpers.rb) and every writer (the GitHub
# Actions pre_fastlane_script, `/secrets pull`) resolves through `build-secrets`,
# which reads this file. Reorganize secrets/ → edit THIS file; code + workflows
# never change.
#
# Values are NOT here — those live in the vault (mirrored to GitHub Secrets +
# materialized into secrets/live/ at runtime). This file only declares WHERE/HOW.
#
# Resolution: `precedence` roots are tried in order; the first existing file wins
# (live real secrets beat committed sample fakes). Phase 7 decouple step keeps
# both roots = `secrets` (today's flat layout); the restructure step flips them
# to secrets/live + secrets/sample.
#
# Secret kinds:
#   file   + encoding base64|pem-or-base64|plain → decoded to a file
#   value                                         → env-first string, file fallback
#   literal (value:)                              → constant string written to a file
#   env_var                                       → env-line; materialized to _env/<VAR>
# Optional per-secret keys: consume_at (out-of-tree read path), mode (chmod octal),
#   by_flavor (per-flavor source_env/rel override), {flavor}/{variant} in rel/consume_at.
# Per-secret keys read ONLY by the deployment/**/secrets-needs.yaml generator (`build-secrets
# needs-generate`, run by ./gradlew syncForkConfig) — the resolver itself ignores them:
#   gha_secret      the GitHub Actions repo secret that carries it (what release-multi-platform.yml
#                   reads as secrets.<NAME>; product-health keeps the two in step). Default: source_env.
#   hint            how a human obtains it (shown by scripts/secrets/setup-secrets.sh).
#   placeholder     input shape for setup-secrets (a file-ish name → asks for a path, else a value).
#   needs_canonical where /secrets pull materializes it, when that is not env:<source_env>.
version: 1
roots:
  live: secrets/live      # REAL secrets — gitignored; materialized in CI / by `/secrets pull`
  sample: secrets/sample  # committed structurally-valid fakes (no-creds fallback)
precedence: [live, sample]

# The vault-alias namespaces THIS file's (and secrets-manifest.yaml's / deployment/**/secrets-needs.yaml's)
# committed aliases carry — RULE-SECRETS-NAMING-CONVENTION-001: `<org>-<suffix>` for org-shared secrets,
# `<project>-<suffix>` for per-app ones. syncForkConfig rewrites them to a fork's own namespaces
# (app-profile org.secrets_namespace + gradle/libs.versions.toml projectName). This file is template-owned,
# so in every fork these two lines still name the template's prefixes — the rewrite's source of truth.
alias_namespaces:
  org: mifos-x
  project: kmp-project-template

secrets:
  # ── kind: file / base64 ────────────────────────────────────────────────────
  firebase_service_account:
    gha_secret: FIREBASE_CREDS
    hint: "Firebase Console → Project Settings → Service Accounts → Generate Key"
    placeholder: "<service-account-json>"
    vault_alias: mifos-x-firebase-service-account
    kind: file
    encoding: base64
    source_env: FIREBASE_CREDS_B64
    rel: android/firebase/firebaseAppDistributionServiceCredentialsFile.json
    mode: "0600"
  play_service_account:
    gha_secret: PLAYSTORE_CREDS
    hint: "Play Console → API access → Service accounts → Download JSON key (PROD)"
    placeholder: "<service-account-json>"
    vault_alias: mifos-x-playstore-service-account
    kind: file
    encoding: base64
    source_env: PLAYSTORE_CREDS_B64
    rel: android/play/playStorePublishServiceCredentialsFile.json
    mode: "0600"
  upload_keystore:
    gha_secret: UPLOAD_KEYSTORE
    hint: "Request from release-mgr or generate via deployment/_shared/scripts/keystore-manager.sh"
    placeholder: "<base64-keystore>"
    vault_alias: mifos-pay-upload-keystore
    kind: file
    encoding: base64
    source_env: UPLOAD_KEYSTORE_B64
    rel: android/keystores/upload_keystore.keystore
    mode: "0600"
  # Signing creds materialize as the .properties FILE config.rb#get_android_signing_config reads
  # (single source of truth, platform-wise path — NOT scattered _env vars). Every key is vault-backed;
  # heals the dropped-signing-creds gap (RULE-SECRETS-KEYSTORE-PROPS-001 / SL6). The `properties` kind
  # assembles KEY=VALUE from vault-backed keys (value ← ENV[source_env], set by the pull's LAYOUT pass).
  upload_keystore_properties:
    kind: properties
    rel: android/keystores/upload_keystore.properties
    mode: "0600"
    keys:
      - { name: storePassword, source_env: KEYSTORE_PASSWORD,       vault_alias: mifos-pay-upload-keystore-storepass }
      - { name: keyAlias,      source_env: KEYSTORE_ALIAS,          vault_alias: mifos-pay-upload-keystore-keyalias }
      # ONE PASSWORD, BY CONSTRUCTION. The keystore is PKCS12 (keytool's default), which has NO
      # separate key password — keytool protects the key with the STORE password regardless of what
      # -keypass says. A distinct key password therefore cannot work: the keystore opens, but every
      # consumer supplying it gets "Get Key failed: Given final block not properly padded", which
      # reads like corruption and sends you hunting for a stale credential that does not exist.
      # So keyPassword resolves from the SAME alias as storePassword. Consumers still read both keys
      # (cmp-android/build.gradle.kts + the fastlane lanes expect keyPassword), but the values cannot
      # diverge because there is one secret behind them. Deliberately NOT a "collapse the mismatch at
      # generation time" fixup — that leaves two secrets free to drift. One source = no drift, ever.
      - { name: keyPassword,   source_env: KEYSTORE_ALIAS_PASSWORD, vault_alias: mifos-pay-upload-keystore-storepass }
      # storeFile REMOVED: it is a filesystem PATH, not a secret. LAYOUT already declares where the
      # keystore lives (`upload_keystore.rel`) and every consumer resolves it through the same
      # resolver — declaring it again as a vault-backed key created a second, weaker source that
      # materialized EMPTY whenever the alias was absent, silently collapsing the signing path to a
      # directory. One source for the path; the vault holds credentials only.
  google_services:
    gha_secret: GOOGLE_SERVICES
    vault_alias: mifos-pay-firebase-google-services
    kind: file
    encoding: base64
    source_env: GOOGLE_SERVICES_B64
    rel: android/google-services.json
    consume_at: cmp-android/google-services.json   # gradle google-services plugin reads it here
  mac_app_store_cert:
    gha_secret: MAC_APP_DISTRIBUTION_CERTIFICATE_B64
    hint: "Apple Developer → Certificates → Mac App Distribution (.p12)"
    placeholder: "<base64-p12>"
    vault_alias: mifos-pay-mac-app-store-cert-p12
    kind: file
    encoding: base64
    source_env: MAC_APP_STORE_CERT_P12_B64
    rel: desktop/macos/app_store.p12
    mode: "0600"
  mac_installer_cert:
    gha_secret: MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_B64
    hint: "Apple Developer → Certificates → 3rd Party Mac Developer Installer (.p12)"
    placeholder: "<base64-p12>"
    vault_alias: mifos-pay-mac-installer-cert-p12
    kind: file
    encoding: base64
    source_env: MAC_INSTALLER_CERT_P12_B64
    rel: desktop/macos/installer.p12
    mode: "0600"

  # ── kind: file / pem-or-base64 (raw PEM passthrough OR base64 decode) ───────
  appstore_auth_key:
    gha_secret: APPSTORE_AUTH_KEY
    hint: "App Store Connect → Users and Access → Keys (Admin or App Manager role)"
    placeholder: "<base64-p8>"
    vault_alias: mifos-x-appstore-auth-key-p8
    kind: file
    encoding: pem-or-base64
    source_env: APPSTORE_AUTH_KEY_B64
    rel: apple/appstore/AuthKey.p8
    mode: "0600"
  match_ssh_key:
    gha_secret: MATCH_SSH_PRIVATE_KEY
    hint: "Match repo SSH deploy key (private half). Generate with `ssh-keygen -t ed25519 -N ''`."
    placeholder: "<base64-ssh-private-key>"
    vault_alias: mifos-x-match-cert-bundle
    kind: file
    encoding: pem-or-base64
    source_env: MATCH_GIT_PRIVATE_KEY
    rel: apple/match/match_ci_key
    mode: "0600"

  # ── kind: literal (constant → file) ────────────────────────────────────────
  match_git_url:
    # DERIVED by syncForkConfig from app-profile/platforms/apple/apple.yaml#match.git.url
    # (== gradle/fork.properties#apple.match.git.url). The neutral template ships the
    # YOUR_ORG placeholder — never a real org URL; a fork authors apple.match.git.url in
    # app-profile and syncForkConfig rewrites this value. Do NOT hand-edit an org literal here.
    kind: literal
    value: "git@github.com:openMF/ios-provisioning-profile.git"
    rel: apple/match/git_url
  match_git_branch:
    # Branch in the Match certificate repo. Single source of truth is `dev` — the
    # openMF/ios-provisioning-profile repo default branch. Forks override per-app if needed.
    kind: literal
    value: "dev"
    rel: apple/match/git_branch

  # ── kind: value (env-first, file fallback) ─────────────────────────────────
  # FLAVOR-AWARE: prod vs demo diverge today (different Firebase App IDs) → by_flavor.
  firebase_android_app_id:
    kind: value
    by_flavor:
      prod: { source_env: FIREBASE_ANDROID_APP_ID,      rel: android/firebase/android_app_id, vault_alias: mifos-pay-firebase-android-app-id }
      demo: { source_env: FIREBASE_ANDROID_DEMO_APP_ID, rel: android/firebase/android_demo_app_id, vault_alias: mifos-pay-firebase-android-demo-app-id }
  # iOS Firebase App IDs — read by config.rb `_secret_file("apple/firebase/ios_*")`
  # (ENV → fork.properties → vault-file fallback chain, lines 248-262). Three distinct
  # keys (not by_flavor): prod tries ios_prod_app_id then ios_app_id; demo uses
  # ios_demo_app_id. All three vaulted; short aliases resolve to the mifos-x-…-ios-* ids.
  firebase_ios_app_id:
    vault_alias: mifos-pay-firebase-ios-app-id
    kind: value
    source_env: FIREBASE_IOS_APP_ID
    rel: apple/firebase/ios_app_id
  firebase_ios_prod_app_id:
    vault_alias: mifos-pay-firebase-ios-prod-app-id
    kind: value
    source_env: FIREBASE_IOS_PROD_APP_ID
    rel: apple/firebase/ios_prod_app_id
  firebase_ios_demo_app_id:
    vault_alias: mifos-pay-firebase-ios-demo-app-id
    kind: value
    source_env: FIREBASE_IOS_DEMO_APP_ID
    rel: apple/firebase/ios_demo_app_id
  # Build-time client key compiled into BuildKonfig.SUPABASE_PUBLISHABLE_KEY — the publishable key of the
  # `lwmswhoxvvoagzkqxiyd` access point (app-profile `publishable_key_env: SUPABASE_PUBLISHABLE_KEY`). The
  # generated core/network buildkonfig region reads ENV first (CI), then this file via resolveSecretPath —
  # secrets/live/ (materialized by `/secrets pull`) else the committed EMPTY secrets/sample/ fake,
  # which yields "" and leaves the client inert (the app falls back to its bundled instance list).
  # CLIENT-SAFE ONLY: the publishable key (sb_publishable_…; a legacy anon JWT also works) — RLS is the
  # boundary, the key ships in the binary. NEVER the service_role / sb_secret_ key, a DB password or URL, or
  # a management token: those stay in the vault for CI / Edge Functions. syncForkConfig refuses a privileged
  # NAME and scripts/product-health/checks/supabase-client-security.sh a privileged VALUE.
  # Alias tier follows the PROJECT the key belongs to: this access point is the shared Mifos org project
  # (its app_config serves every Mifos app), so the alias is org-tier `<org>-supabase-publishable-key`; a
  # fork's OWN Supabase project takes a project-tier `<project>-supabase-publishable-key`.
  # NO gha_secret: CI gets it the same way as every other vaulted value — the release workflows decrypt the vault
  # with SOPS_AGE_KEY into secrets/live/ (pre-materialized mode). A gha_secret no workflow reads is a delivery
  # path that does not exist (SN-2).
  supabase_publishable_key:
    hint: "Supabase dashboard → Project Settings → API Keys → Publishable key (sb_publishable_…)"
    placeholder: "<supabase-publishable-key>"
    vault_alias: mifos-x-supabase-publishable-key
    kind: value
    source_env: SUPABASE_PUBLISHABLE_KEY
    rel: supabase/publishable_key
  appstore_key_id:
    gha_secret: APPSTORE_KEY_ID
    hint: "App Store Connect key id (10-char alphanumeric)"
    placeholder: "<key-id>"
    vault_alias: mifos-x-appstore-key-id
    kind: value
    source_env: APPSTORE_KEY_ID
    rel: apple/appstore/key_id
  appstore_issuer_id:
    gha_secret: APPSTORE_ISSUER_ID
    hint: "App Store Connect issuer id (UUID)"
    placeholder: "<issuer-id>"
    vault_alias: mifos-x-appstore-issuer-id
    kind: value
    source_env: APPSTORE_ISSUER_ID
    rel: apple/appstore/issuer_id

  # ── kind: env_var (env-line → _env/<VAR>; consumed as env on CI) ────────────
  match_password:               { kind: env_var, source_env: MATCH_PASSWORD, vault_alias: mifos-x-match-password, hint: "Match encryption password — used to encrypt certs at rest in the Match git repo", placeholder: "<password>", gha_secret: MATCH_PASSWORD }
  azure_ts_account_name:        { kind: env_var, source_env: AZURE_TS_ACCOUNT_NAME, vault_alias: mifos-pay-azure-ts-account-name, hint: "Azure → Trusted Signing → Signing account name", placeholder: "<account-name>", gha_secret: AZURE_TRUSTED_SIGNING_ACCOUNT }
  azure_ts_cert_profile_name:   { kind: env_var, source_env: AZURE_TS_CERT_PROFILE_NAME, vault_alias: mifos-pay-azure-ts-cert-profile-name, hint: "Azure → Trusted Signing → Certificate profile name", placeholder: "<cert-profile-name>", gha_secret: AZURE_CERT_PROFILE_NAME }
  azure_ts_client_id:           { kind: env_var, source_env: AZURE_TS_CLIENT_ID, vault_alias: mifos-pay-azure-ts-client-id, hint: "Azure → App registration for GH OIDC federation", placeholder: "<azure-client-uuid>", gha_secret: AZURE_CLIENT_ID }
  azure_ts_subscription_id:     { kind: env_var, source_env: AZURE_TS_SUBSCRIPTION_ID, vault_alias: mifos-pay-azure-ts-subscription-id, hint: "Azure → Subscriptions → Subscription ID", placeholder: "<azure-subscription-uuid>", gha_secret: AZURE_SUBSCRIPTION_ID }
  azure_ts_tenant_id:           { kind: env_var, source_env: AZURE_TS_TENANT_ID, vault_alias: mifos-pay-azure-ts-tenant-id, hint: "Azure → Entra ID → Overview → Tenant ID", placeholder: "<azure-tenant-uuid>", gha_secret: AZURE_TENANT_ID }
  cloudflare_account_id:        { kind: env_var, source_env: CLOUDFLARE_ACCOUNT_ID, vault_alias: mifos-x-cloudflare-account-id, hint: "Cloudflare → Account → Overview → Account ID", placeholder: "<cloudflare-account-id>", gha_secret: CLOUDFLARE_ACCOUNT_ID }
  cloudflare_pages_api_token:   { kind: env_var, source_env: CLOUDFLARE_PAGES_API_TOKEN, vault_alias: mifos-x-cloudflare-api-token, hint: "Cloudflare → My Profile → API Tokens → Create token with Pages:Edit", placeholder: "<cloudflare-api-token>", gha_secret: CLOUDFLARE_API_TOKEN }
  github_release_upload_token:  { kind: env_var, source_env: GH_TOKEN, vault_alias: mifos-pay-github-release-upload-token, hint: "GitHub Actions provides ${{ secrets.GITHUB_TOKEN }} for repo-scoped uploads", placeholder: "<gh-pat-or-actions-token>", gha_secret: GITHUB_TOKEN }
  # Microsoft Store (Desktop Windows MSIX → Store). All 7 are vault-managed (single
  # SoT, auto-synced); only the client secret is sensitive. gradle/fork.properties
  # windows.* keys (same ENV names) are the OSS-fork fallback.
  ms_app_id:                          { kind: env_var, source_env: MS_APP_ID, vault_alias: mifos-x-msstore-app-id, hint: "Partner Center → Your app → Product management → Product identity → Store ID", placeholder: "<store-app-id>", gha_secret: MS_APP_ID }
  ms_partner_center_tenant_id:        { kind: env_var, source_env: MS_PARTNER_CENTER_TENANT_ID, vault_alias: mifos-x-ms-partner-center-tenant-id, hint: "Azure → Entra ID → Tenant ID (same as Azure tenant)", placeholder: "<azure-tenant-uuid>", gha_secret: MS_PARTNER_CENTER_TENANT_ID }
  ms_partner_center_client_id:        { kind: env_var, source_env: MS_PARTNER_CENTER_CLIENT_ID, vault_alias: mifos-x-ms-partner-center-client-id, hint: "Azure → App registration for Partner Center", placeholder: "<client-uuid>", gha_secret: MS_PARTNER_CENTER_CLIENT_ID }
  ms_partner_center_client_secret:    { kind: env_var, source_env: MS_PARTNER_CENTER_CLIENT_SECRET, vault_alias: mifos-x-ms-partner-center-client-secret, hint: "Azure → App registration → Certificates & secrets → Client secret", placeholder: "<client-secret>", gha_secret: MS_PARTNER_CENTER_CLIENT_SECRET }
  windows_msix_identity_name:         { kind: env_var, source_env: WINDOWS_MSIX_IDENTITY_NAME, vault_alias: mifos-x-msstore-identity-name, hint: "Partner Center → Your app → Product management → Product identity → Package/Identity/Name", placeholder: "<publisher.appname>", gha_secret: WINDOWS_MSIX_IDENTITY_NAME }
  windows_msix_publisher:             { kind: env_var, source_env: WINDOWS_MSIX_PUBLISHER, vault_alias: mifos-x-msstore-publisher, hint: "Partner Center → Your app → Product management → Product identity → Package/Identity/Publisher", placeholder: "CN=<publisher-id>", gha_secret: WINDOWS_MSIX_PUBLISHER }
  windows_msix_publisher_display_name: { kind: env_var, source_env: WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME, vault_alias: mifos-x-msstore-publisher-display-name, hint: "Partner Center → Your app → Product management → Product identity → Package/Properties/PublisherDisplayName", placeholder: "<publisher-display-name>", gha_secret: WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME }
  # Build-time client key compiled into BuildKonfig.FRED_API_KEY. `needs_canonical` tells the
  # deployment/**/secrets-needs.yaml generator where /secrets pull puts it (local.properties); it is NOT
  # consume_at, which would make this resolver overwrite the whole local.properties with one value.
  fred_api_key:                 { kind: env_var, source_env: FRED_API_KEY, vault_alias: mifos-x-fred-api-key, needs_canonical: local.properties }
  netlify_auth_token:           { kind: env_var, source_env: NETLIFY_AUTH_TOKEN, vault_alias: mifos-x-netlify-auth-token, hint: "Netlify → User settings → Applications → New personal access token", placeholder: "<netlify-pat>", gha_secret: NETLIFY_AUTH_TOKEN }
  netlify_site_id:              { kind: env_var, source_env: NETLIFY_SITE_ID, vault_alias: mifos-pay-netlify-site-id, hint: "Netlify → Site settings → General → Site ID", placeholder: "<netlify-site-id>" }
  vercel_org_id:                { kind: env_var, source_env: VERCEL_ORG_ID, vault_alias: mifos-x-vercel-org-id, hint: "Vercel → Team settings → General → Team ID", placeholder: "<vercel-org-id>", gha_secret: VERCEL_ORG_ID }
  vercel_project_id:            { kind: env_var, source_env: VERCEL_PROJECT_ID, vault_alias: mifos-pay-vercel-project-id, hint: "Vercel → Project → Settings → Project ID", placeholder: "<vercel-project-id>", gha_secret: VERCEL_PROJECT_ID }
  vercel_token:                 { kind: env_var, source_env: VERCEL_TOKEN, vault_alias: mifos-x-vercel-token, hint: "Vercel → Account → Settings → Tokens", placeholder: "<vercel-token>", gha_secret: VERCEL_TOKEN }
