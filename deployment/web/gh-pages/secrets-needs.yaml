# deployment/web/gh-pages/secrets-needs.yaml
# GH Pages uses repo-scoped GITHUB_TOKEN (no aliases needed) when CI is the
# actions/deploy-pages path. Manual local-only path uses npm gh-pages CLI which
# needs git push permission — covered by the developer's git auth.

schema_version: "2.0"
target: web-gh-pages
dual_mode: true
required_for: [github-pages-publish]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs: []
