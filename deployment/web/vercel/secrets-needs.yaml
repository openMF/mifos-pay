# deployment/web/vercel/secrets-needs.yaml

schema_version: "2.0"
target: web-vercel
dual_mode: true
required_for: [web-vercel-publish]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: vercel_token, required_for: ["auth"] }
  - { secret: vercel_org_id, required_for: ["target-org"] }
  - { secret: vercel_project_id, required_for: ["target-project"] }
