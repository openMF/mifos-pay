# deployment/web/cloudflare-pages/workflow-snippet.yml
name: web-cloudflare-pages-deploy
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Materialize secrets (vault-mode)
        if: ${{ secrets.SOPS_AGE_KEY != '' }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bash deployment/_shared/scripts/secrets-pull.sh --required-for web-cloudflare-pages-publish

      - name: Build web dist
        run: ./gradlew :cmp-web:jsBrowserDistribution

      - name: Stage _headers + _redirects + wrangler.toml
        run: |
          cp deployment/web/cloudflare-pages/_headers cmp-web/build/dist/js/productionExecutable/_headers
          cp deployment/web/cloudflare-pages/_redirects cmp-web/build/dist/js/productionExecutable/_redirects

      - name: Resolve this fork's Cloudflare Pages project
        run: echo "CF_PAGES_PROJECT=$(bash deployment/_shared/scripts/fork-identity.sh get web.cloudflare.project)" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:   pages deploy cmp-web/build/dist/js/productionExecutable --project-name=${{ env.CF_PAGES_PROJECT }}
