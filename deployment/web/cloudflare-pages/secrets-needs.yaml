# deployment/web/cloudflare-pages/secrets-needs.yaml

schema_version: "2.0"
target: web-cloudflare-pages
dual_mode: true
required_for: [web-cloudflare-pages-publish]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: cloudflare_pages_api_token, required_for: ["wrangler-auth"] }
  - { secret: cloudflare_account_id, required_for: ["wrangler-target"] }
