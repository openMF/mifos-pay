# deployment/web/netlify/secrets-needs.yaml

schema_version: "2.0"
target: web-netlify
dual_mode: true
required_for: [web-netlify-publish]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: netlify_auth_token, required_for: ["auth"] }
  - { secret: netlify_site_id, required_for: ["target-site"] }
