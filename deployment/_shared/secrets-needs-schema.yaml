# ═════════════════════════════════════════════════════════════════════════════
# secrets-needs-schema.yaml — DUAL-MODE per-target secrets contract (schema 2.0)
#
# Authority:  RULE-DEPLOYMENT-MANIFEST-001 (DM8)
# JSON Schema: core/schemas/secrets-needs.schema.json
#
# Every `deployment/<platform>/<target>/secrets-needs.yaml` declares ONE thing: which
# `secrets/LAYOUT.yaml` entries the target needs, and what for (`needs:`). It names LAYOUT keys only —
# no alias, no prefix, no fork identity — so the file is byte-identical in the template and every fork
# and deployment/ stays purely template-owned.
#
# Everything per-secret (vault alias, path, kind, CI secret, how to obtain it) lives in LAYOUT. The
# expansion is computed, never stored:
#   · ./gradlew syncForkConfig (build_secrets.rb `needs-generate`) writes the one generated file, the
#     repo-root secrets-manifest.yaml — the framework reads it through a workspace symlink;
#   · scripts/secrets/* (setup/status) get a target's rows at run time via `needs-expand`.
#
# Why: LAYOUT and these files used to declare the same facts by hand and drifted — 14 aliases LAYOUT
# did not know and 13 CI names no workflow reads (2026-10-29). Enforced by
# scripts/product-health/checks/secrets-needs-generated.sh (SN-1 needs-only + manifest current ·
# SN-2 CI names real). The machine schema is core/schemas/secrets-needs.schema.json.
# ═════════════════════════════════════════════════════════════════════════════

schema_version: "2.0"
dual_mode: true

# ── Example per-target secrets-needs.yaml (illustrative, NOT live) ──────────
example: |
  schema_version: "2.0"
  target: android-play-production
  dual_mode: true
  required_for: [android-signing, android-play-prod-publish]

  needs:
    - { secret: upload_keystore, required_for: ["sign-verification"] }
    - { secret: play_service_account, required_for: ["promote-to-prod"] }

# ── Field reference ─────────────────────────────────────────────────────────
field_reference:
  schema_version: "Required. \"2.0\" (needs only) or \"1.0\" (legacy, hand-authored rows — still read, reported as WARN)."
  target: "The deploy target id (e.g. android-play-production)."
  dual_mode: "Literal `true`."
  required_for: "Capabilities this target provides."
  needs:
    type: "array of { secret, required_for }"
    secret: "A key under secrets/LAYOUT.yaml#secrets. Unknown key → syncForkConfig FAILS."
    required_for: "What this target uses the secret for."
  expanded_from_layout_into_secrets-manifest.yaml:
    alias: "LAYOUT vault_alias (per key for kind: properties, per flavor for by_flavor)."
    canonical: "secrets/live/<rel>, or env:<source_env> for kind: env_var, or needs_canonical."
    materialize: "file → { format: file, via: copy[, mode] } · properties/env_var → { format: env, via: export }."
  expanded_at_run_time_for_scripts/secrets:
    gha_secret: "LAYOUT gha_secret — the repo secret release-multi-platform.yml reads (SN-2)."
    hint: "LAYOUT hint."
    placeholder: "LAYOUT placeholder (its shape tells setup-secrets.sh file vs value)."

# ── Validator hooks ─────────────────────────────────────────────────────────
validator_hooks:
  generate: "./gradlew syncForkConfig   (or: deployment/scripts/build-secrets needs-generate) → secrets-manifest.yaml"
  expand: "deployment/scripts/build-secrets needs-expand --file <secrets-needs.yaml> --kind manual|vault"
  check: "scripts/product-health/checks/secrets-needs-generated.sh"
  preflight: "deployment/_shared/scripts/manual-preflight.sh"
  schema_validate: "core/scripts/deployment-manifest-validate.sh"
