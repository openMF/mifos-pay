# deployment/_shared/secrets-needs.yaml
# =============================================================================
# PROJECT-WIDE secrets — needed by the BUILD itself, not by any one deploy target.
# =============================================================================
# The per-target files (deployment/<platform>/<target>/secrets-needs.yaml) declare what a
# SPECIFIC target needs to sign and upload. A key compiled into BuildKonfig is different: it is
# needed by android, ios, desktop AND web alike, so declaring it under one target would be
# arbitrary and declaring it under all eighteen would be noise.
#
# secrets-manifest.yaml is a UNION over every secrets-needs.yaml, so an alias declared here
# contributes exactly once and de-dupes against any target that also names it.
#
# WHY THIS FILE EXISTS: the FRED key had no valid home under the per-target schema, so it was
# hand-written into secrets-manifest.yaml — a file headed "GENERATED, DO NOT EDIT BY HAND". It
# survived there as a bare `- alias:` row with no `canonical:`/`materialize:` (the signature of a
# hand-edit into generated output) and was silently dropped by the next regeneration. Declaring it
# here makes it survive regeneration, which is the actual fix.

schema_version: "2.0"
target: _shared
required_for: [build]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: fred_api_key, required_for: ["build"] }
  - { secret: supabase_publishable_key, required_for: ["build"] }
