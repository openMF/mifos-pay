# deployment/ios/testflight/secrets-needs.yaml

schema_version: "2.0"
target: ios-testflight
dual_mode: true
required_for: [ios-signing, ios-testflight]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: appstore_auth_key, required_for: ["asc-auth", "build-sign", "testflight-upload"] }
  - { secret: match_ssh_key, required_for: ["match-clone"] }
  - { secret: match_password, required_for: ["match-decrypt"] }
