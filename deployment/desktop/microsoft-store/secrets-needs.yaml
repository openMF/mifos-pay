# deployment/desktop/microsoft-store/secrets-needs.yaml
# Tier-2 — Microsoft Partner Center submission (MSIX → Store; the Store re-signs).
#
# 2026-06-24: all 7 vault rows now exist in SECRETS_ALIAS_REGISTRY.yaml (group
# kmp-project-template). The 6 non-secret identifiers (Store ID, AAD tenant/client
# GUIDs, MSIX identity name/publisher/display) + the 1 real secret (client secret)
# all live in the vault as the single SoT and materialize to ENV. No Azure
# subscription / code-signing cert needed — the Store signs the MSIX.

schema_version: "2.0"
target: desktop-microsoft-store
dual_mode: true
required_for: [desktop-microsoft-store]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: ms_partner_center_tenant_id, required_for: ["service-principal-auth"] }
  - { secret: ms_partner_center_client_id, required_for: ["service-principal-auth"] }
  - { secret: ms_partner_center_client_secret, required_for: ["service-principal-auth"] }
  - { secret: ms_app_id, required_for: ["submission"] }
  - { secret: windows_msix_identity_name, required_for: ["msix-build"] }
  - { secret: windows_msix_publisher, required_for: ["msix-build"] }
  - { secret: windows_msix_publisher_display_name, required_for: ["msix-build"] }
