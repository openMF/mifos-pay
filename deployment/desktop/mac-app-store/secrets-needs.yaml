# deployment/desktop/mac-app-store/secrets-needs.yaml

schema_version: "2.0"
target: desktop-mac-app-store
dual_mode: true
required_for: [macos-signing, desktop-mac-app-store]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: mac_app_store_cert, required_for: ["mas-sign"] }
  - { secret: mac_installer_cert, required_for: ["pkg-sign"] }
  - { secret: appstore_auth_key, required_for: ["asc-upload"] }
  - { secret: appstore_key_id, required_for: ["asc-upload"] }
  - { secret: appstore_issuer_id, required_for: ["asc-upload"] }
