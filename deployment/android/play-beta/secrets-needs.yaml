# deployment/android/play-beta/secrets-needs.yaml
# Promotion-only target — needs only the Play publisher JSON (no keystore).

schema_version: "2.0"
target: android-play-beta
dual_mode: true
required_for: [android-play-internal-publish]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: play_service_account, required_for: ["promote"] }
