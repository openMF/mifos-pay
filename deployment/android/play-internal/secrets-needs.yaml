# deployment/android/play-internal/secrets-needs.yaml
# Dual-mode schema per AC79/AC92.

schema_version: "2.0"
target: android-play-internal
dual_mode: true
required_for: [android-signing, android-play-internal-publish]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: upload_keystore, required_for: ["build", "sign"] }
  - { secret: upload_keystore_properties, required_for: ["sign"] }
  - { secret: play_service_account, required_for: ["upload"] }
