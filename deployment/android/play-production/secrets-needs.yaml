# deployment/android/play-production/secrets-needs.yaml
# Production-tier target — gated by requires_confirm + declares both capabilities (AC34/AC35).

schema_version: "2.0"
target: android-play-production
dual_mode: true
required_for: [android-signing, android-play-prod-publish]

# AUTHORED — the secrets/LAYOUT.yaml entries this target needs. LAYOUT owns every per-secret fact
# (vault alias, path, kind, CI env var, how to obtain it); ./gradlew syncForkConfig expands this list.
needs:
  - { secret: upload_keystore, required_for: ["sign-verification"] }
  - { secret: upload_keystore_properties, required_for: ["sign-verification"] }
  - { secret: play_service_account, required_for: ["promote-to-prod"] }
