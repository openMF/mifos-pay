# Minimal Android-only release — bypasses the multi-platform orchestrator's large
# reusable-workflow graph (which triggers a GitHub-backend startup_failure on the
# fork). Calls ONLY the publish-android reusable workflow → tiny graph.
name: Release · Android Only
on:
  workflow_dispatch:
    inputs:
      android_rung:
        description: 'Android top rung (lower rungs auto-fire)'
        type: choice
        options: [firebase, firebase+internal, internal, beta, production]
        default: firebase
      version_tag:
        description: 'Version (empty → auto YYYY.M.D.run)'
        default: ''

jobs:
  version:
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-26.04' }}
    outputs:
      tag: ${{ steps.c.outputs.tag }}
    steps:
      - id: c
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            echo "tag=${{ inputs.version_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(date -u +%Y.%-m.%-d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

  release-android:
    needs: version
    uses: therajanmaurya/mifos-x-actionhub-publish-android-kmp/.github/workflows/release.yaml@v2.0.30
    with:
      android_package_name: cmp-android
      version_tag: ${{ needs.version.outputs.tag }}
      starting_rung: ${{ inputs.android_rung }}
      # REQUIRED — the deploy lanes live in deployment/fastlane/Fastfile, not at the root.
      # The root fastlane/Fastfile defines exactly ONE lane (`ios build_ios`, for the PR check),
      # so with fastlane_cwd left at its default '.' this workflow resolves `fastlane android
      # deployInternal` against a Fastfile that has no `android` platform at all and dies with
      # "Could not find lane" — after a full build. Asserted by RT-7 of
      # scripts/product-health/checks/ruby-toolchain-coherence.sh, which scans every caller.
      fastlane_cwd: deployment
    secrets: inherit
