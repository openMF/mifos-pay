# .github/workflows/deployment-status.yml — v2 deployment rung-matrix dashboard
#
# Reads deployment/PROMOTION_LOG.yaml + emits Markdown step summary.
# Runs hourly + on manual dispatch.
name: Deployment Status
run-name: "📊 Deployment Status · ${{ github.ref_name }}"

on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch:

jobs:
  status:
    uses: openMF/mifos-x-actionhub/.github/workflows/deployment-status-v2.yaml@v1.0.72
    with:
      promotion_log_path: 'deployment/PROMOTION_LOG.yaml'
      include_play_api:   false
      include_asc_api:    false
    secrets: inherit
