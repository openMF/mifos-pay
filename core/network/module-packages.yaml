schema_version: "1.0"
# ─────────────────────────────────────────────────────────────────────────────
# core/network — module-packages.yaml
#
# WHAT THIS IS
# The lifecycle of every package in this module: which ones a clean fork keeps, which the customizer
# deletes, and which are the fork's own. It sits next to the code it describes, so the module that
# gains a package is the module whose file changes.
#
# WHY IT IS NOT IN app-profile/app.yaml
# That file is `owner: merge` — it carries template AND fork declarations, so a template edit landing
# beside a fork edit is a 3-way merge waiting to happen. This file is TEMPLATE-ONLY and full-copies.
# Same split that took Room's `migration-units.yaml` out of app.yaml.
# `app-profile/app.yaml#module_packages` lists every one of these files; G-CORE-PKG (MP-6) fails if
# that list and the files on disk disagree.
#
# ── SECTIONS ─────────────────────────────────────────────────────────────────
# The section IS the owner — there is no `owner:` field to keep in step with it.
#
#   demo:      template-authored SHOWCASE. `scripts/remove-demo.sh` DELETES these packages, and the
#              ROW SURVIVES with `status: removed`. The row is deliberately kept: deleting it would
#              delete the RECORD, and `/kmp-project-template-sync` then cannot tell a package that
#              was stripped on purpose from one that went missing — "restore it" is right in exactly
#              one of those cases.
#   template:  template-authored FRAMEWORK code. A clean fork KEEPS it and a sync full-copies it, so
#              the fork keeps receiving fixes. Do not edit these packages in a fork; extend them
#              through the module's `Fork*` seam instead.
#   fork:      the fork's OWN packages. Never deleted, never synced over. A fork's package needs NO
#              row at all — undeclared IS fork — so a row here is self-documenting only.
#
# ── FIELDS ───────────────────────────────────────────────────────────────────
#   id:        the package directory under `src/<sourceSet>/kotlin/kpt/core/network/<id>/`.
#   status:    DERIVED FROM DISK, never hand-maintained. Rewritten by `remove-demo.sh --apply`.
#                exists   the directory is present
#                removed  absent and this is a `demo:` row — the customizer deleted it, as designed
#                missing  absent and NOT a demo row — real drift: a hand-deletion, or a sync that
#                         never delivered it. Investigate rather than "fix" the status.
#              Because it is derived, a template sync full-copying this file cannot corrupt it: the
#              next customizer run recomputes it from what is actually on disk.
#
# ── HOW TO UPDATE ────────────────────────────────────────────────────────────
#   add a showcase package  create `kpt/core/network/<id>/`, add a row under `demo:`, and add a
#                           `demo-showcase` rule for it in customization-surface.yaml (MP-1 fails
#                           without it — the package would silently stop syncing to forks).
#   add framework code      create the package, add a row under `template:`.
#   add your own (fork)     just create the package. Optionally add a row under `fork:`.
#   never                   hand-edit `status:` — it is recomputed and your edit will be overwritten.
#
# Audited by scripts/product-health/checks/core-package-ownership.sh (MP-1..MP-6).
# ─────────────────────────────────────────────────────────────────────────────
module: network


# Deleted by `remove-demo.sh`; the row survives with `status: removed` as the record.
demo:
  - { id: coingecko,       status: removed } # crypto market data endpoint
  - { id: fineract,        status: removed } # Mifos Fineract sandbox — declared+runtime header showcase
  - { id: frankfurter,     status: removed } # FX rates endpoint
  - { id: fred,            status: removed } # US Federal Reserve endpoint
  - { id: jsonplaceholder, status: removed } # writable REST showcase
  - { id: worldbank,       status: removed } # macro indicators endpoint

# Kept by a clean fork, full-copied by a sync.
template:
  - { id: config,  status: exists }         # AppAccessPoints / AppUrlTypes (generated)
  - { id: di,      status: exists }         # NetworkModule + the ForkNetworkModule fork seam
  # Named for the Supabase project REF — the access-point id, the package, and the @ApiBinding
  # argument are the same string, and all three come from app-profile/app.yaml. Rename them
  # together or network-ksp rejects the annotation against the declared ids.
  - { id: lwmswhoxvvoagzkqxiyd, status: exists }   # the Supabase access point every fork gets by default

# The fork's own. Listed for documentation only — undeclared packages are fork too.
fork:
  - { id: main,    status: exists }         # the fork's primary endpoint package
  - { id: staging, status: exists }         # the fork's staging endpoint package
