# app-profile/platforms/ubuntu/app-content/privacy.yaml — feeds Snap Store listing metadata +
# Flathub `metainfo.xml` (`<content_rating>` / OARS + privacy-policy reference). Fork-owned SoT
# — syncForkConfig / the release readiness gate reads this file; it does not itself submit to
# the Snap Store or Flathub.
#
# App Toolkit posture: 100% offline, no login, no account, no ads, no tracking, no data
# collection or transmission of any kind.

privacy_policy_url: https://raw.githubusercontent.com/openMF/kmp-project-template/main/legal/output/privacy-policy.md

# Whether the app collects any personal data at all. False for the template — the demo
# features are entirely local.
collects_data: false
# What is collected and why, when [collects_data] is true.
data_collection_notes: >
  App collects and transmits NO user data. All state (loans, reminders,
  calculator inputs) is stored locally on-device only. Read-only public-data
  calls (FRED interest rates, World Bank macro data, currency exchange
  rates) carry no personal identifiers.

# Whether the app shows ads.
contains_ads: false
# Whether an account is needed to use the app. False means a reviewer can exercise every
# feature without credentials.
requires_account: false
# Which network access the app needs, and what for. Snap confinement grants it from this
# declaration, so an omission shows up as a runtime failure rather than a build error.
network_access:
  required: true
  purpose: Read-only public-data fetches (FRED interest rates, World Bank macro data, currency exchange rates)
  transmits_user_data: false

# OARS rating answers — the Linux-store equivalent of the IARC questionnaire.
oars_content_rating:        # Flathub AppStream <content_rating type="oars-1.1"> — no descriptors triggered
  violence-cartoon: none
  violence-fantasy: none
  violence-realistic: none
  violence-bloodshed: none
  violence-sexual: none
  violence-desecration: none
  violence-slavery: none
  violence-worship: none
  drugs-alcohol: none
  drugs-narcotics: none
  drugs-tobacco: none
  sex-nudity: none
  sex-themes: none
  sex-homosexuality: none
  sex-prostitution: none
  sex-adultery: none
  sex-appearance: none
  language-profanity: none
  language-humor: none
  language-discrimination: none
  language-drugs: none
  social-chat: none
  social-info: none
  social-audio: none
  social-location: none
  social-contacts: none
  money-purchasing: none
  money-gambling: none
