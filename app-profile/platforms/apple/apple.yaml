# app-profile/platforms/apple/apple.yaml — Apple-shared (iOS + macOS: signing, Firebase, TestFlight, ASC).
# Only values that DIFFER from the common app.yaml live here.
apple:
  team_id: L432S2FZP5                        # apple.team.id — Apple Developer Team ID (gradle/libs.versions.toml#iosTeamId)
  # The App Store NUMERIC id (not the bundle id). Deploy lanes already needed it; the APP needs it too,
  # because `AppReviewManager.promptForCustomReview()` deep-links to the store listing and iOS has no
  # bundle-id-based store URL. It lived in `deployment-layer/DEPLOYMENT_PROJECT_CONFIG.yaml` and
  # hardcoded in `deployment/ios/testflight/lane.rb` — neither of which the running app can read.
  #
  # This is the PROJECT-scope SoT. `resolve-deploy-config.sh` keeps the three scopes in order for
  # deploy time (deployment-layer override → here → _org/company.yaml), and `syncForkConfig` projects
  # THIS value into the generated `core/platform/config/AppReviewConfig` for runtime.
  app_store_id: ""                           # apple.app.store.id (numeric) — empty until Mifos Pay is published on the App Store
  match:
    git:
      url: git@github.com:openMF/ios-provisioning-profile.git   # apple.match.git.url — deployment/BOOTSTRAP.md
      branch: dev                            # apple.match.git.branch
  firebase:
    # No separate prod/demo iOS Firebase apps exist (single GoogleService-Info.plist) — both
    # resolve to the same real app id as ios_app_id below.
    ios_app_id_prod: 1:728434912738:ios:86a7badfaed88b841a1dbb
    ios_app_id_demo: 1:728434912738:ios:86a7badfaed88b841a1dbb
    ios_app_id: 1:728434912738:ios:86a7badfaed88b841a1dbb   # firebase.ios.app.id — cmp-ios/iosApp/GoogleService-Info.plist (org.mifospay)
  testers:
    internal_group: Internal Testers         # apple.testers.internal.group
    external_group: mifos-mobile-apps        # apple.testers.external.group — deployment/ios/testflight distribution_groups
    external_public_link: "true"             # apple.testers.external.public.link
    # External TestFlight tester roster (emails — PUBLIC identifiers, not secrets). deployment/_shared/config.rb
    # #sync_testflight_testers reads this list and adds each as an external beta tester on the group.
    # For an org-shared roster, materialize this from your org SoT. Leave empty for public-link-only.
    external_emails: []                      # apple.testers.external.emails — e.g. [alice@example.com, bob@example.com]
  keywords: 'wallet,payments,transfer,sendmoney,QRpay,invoice,card,linkbank,KYC,merchant'  # store.ios.keywords — real, from dev fastlane/metadata/ios/en-US/keywords.txt
  category: 'FINANCE'                          # store.ios.category — real, from dev fastlane/metadata/ios/primary_category.txt
  ios:
    secondary_category: 'UTILITIES'            # store.ios.secondary.category — real, from dev fastlane/metadata/ios/secondary_category.txt
  # App Store trade-representative contact (App Review → App Information). iOS + macOS App Store.
  # NOT YET AUTHORED — left blank rather than filled with fabricated business-registration details
  # (name/address/phone). Someone with Mifos Initiative's real registered trade-representative
  # information must fill these in before an actual App Store submission. email_address uses the
  # organization's real published contact (team@mifos.org, matches org.email elsewhere in this file)
  # since that one field is a real, defensible value. syncForkConfig DERIVES
  # deployment/{ios/appstore,desktop/mac-app-store}/metadata/trade_representative_contact_information/*.txt
  # from these keys — never hand-edit those .txt files directly.
  trade_representative:
    first_name: ''                           # unauthored — store.apple.trade.first.name
    last_name: ''                             # unauthored — store.apple.trade.last.name
    address_line1: ''                        # unauthored — store.apple.trade.address.line1
    address_line2: ''                        # store.apple.trade.address.line2
    address_line3: ''                        # store.apple.trade.address.line3
    city_name: ''                             # unauthored — store.apple.trade.city
    state: ''                                 # unauthored — store.apple.trade.state
    country: 'US'                              # store.apple.trade.country — real (Mifos Initiative is US-based)
    postal_code: ''                          # unauthored — store.apple.trade.postal.code
    phone_number: ''                         # unauthored — store.apple.trade.phone
    email_address: 'team@mifos.org'            # real — Mifos Initiative's published contact email
    is_displayed_on_app_store: 'false'       # store.apple.trade.displayed
