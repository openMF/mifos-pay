    owner: template
  - glob: "fastlane-config/**"
    owner: template
  # The license header every source file carries — ONE fork-owned source (LicenseHeader.kt renders it
  # for Spotless, syncForkConfig and the KSP processors; the holder is app.yaml#org.name). Must precede
  # spotless/** (first match wins) so a sync never resets a fork's header.
  - glob: "spotless/license-header.txt"
    owner: fork
  - glob: "spotless/**"
    owner: template
  - glob: "gradle/wrapper/**"
    owner: template
  # NOTE: idea-layer/** is framework tooling (the claude-product-cycle project layer), NOT shipped
  # white-label app code, and the template tracks zero idea-layer paths — so it carries no ownership
  # rule here. A fork's idea-layer lives in its framework tree, never in the template source repo.
  # In-template feature-authoring guide (E5 consumption contract) — template-authored, synced like
  # the per-module CONSUMPTION.md docs. (closes a pre-existing E5 classification gap)
  - glob: "FEATURE_AUTHORING.md"
    owner: template
  - glob: "scripts/**"
    owner: template
  # Lint and analysis config is the template's, whole: a fork meets the rules in its own code, it does
  # not carry a baseline that exempts it from them.
  - glob: "config/**"
    owner: template
  - glob: "secrets/sample/**"
    owner: template
  # The fork's own secret rows (its client keys) — read by build_secrets.rb on top of LAYOUT.yaml, which is
  # template-owned and replaced every sync. Add-only: a key LAYOUT.yaml declares is ignored.
  - glob: "secrets/fork-layout.yaml"
    owner: fork
  - glob: "secrets/**"                        # LAYOUT.yaml + scaffold (live/ is fork above)
    owner: template
  - glob: "docs/**"
    owner: template
  - glob: ".github/**"
    owner: template
  - glob: ".run/**"
    owner: template
  # root-level template files (mirror scripts/white-label/sync-dirs.sh SYNC_FILES)
  - { glob: "Gemfile",                       owner: template }
  - { glob: "Gemfile.lock",                  owner: template }
  - { glob: "ci-prepush.sh",                 owner: template }
  - { glob: "ci-prepush.bat",                owner: template }
  - { glob: "gradlew",                       owner: template }
  - { glob: "gradlew.bat",                   owner: template }
  - { glob: "compose_compiler_config.conf",  owner: template }
  - { glob: "scripts/white-label/sync-dirs.sh",                  owner: template }
  - { glob: "scripts/white-label/fork-init.sh",                 owner: template }
  - { glob: "setup-project.sh",              owner: template }
  - { glob: "scripts/white-label/keystore.sh",           owner: template }
  - { glob: "scripts/white-label/firebase.sh",             owner: template }
  - { glob: "generateModuleGraphs.sh",       owner: template }
  - { glob: "gradle/fork.properties.template", owner: template }
  - { glob: "gradle/gradle-daemon-jvm.properties", owner: template }
  - { glob: ".editorconfig",                 owner: template }
  - { glob: ".gitattributes",                owner: template }
  - { glob: ".gitignore",                    owner: template }
  - { glob: ".actrc",                        owner: template }
  - { glob: ".ruby-version",                 owner: template }
  - { glob: ".kover-floor.yml",              owner: template }
  - { glob: ".claudeignore",                 owner: template }
  - { glob: "customization-surface.yaml",    owner: template }  # this contract self-syncs (reached via SYNC_FILES — WS4/T6)
  - { glob: "version.txt",                   owner: template }
  # /lib-integrate writes per-fork `<lib>.local=true` links here; the template adds library rows. A full
  # copy reset every fork's links, so it is 3-way merged like gradle.properties (fork keys win).
  - { glob: "lib-integrate.properties",      owner: merge, strategy: properties-3way }
  - { glob: "secrets-manifest.yaml",         owner: generated } # GENERATED by syncForkConfig from deployment/**/secrets-needs.yaml — never synced, never hand-edited
  # MIXED file: fork values (fork.project.name) + template infra (JVM args, gradle/kotlin flags, memory,
  # toggles). owner:fork froze the template infra out; 3-way merge brings template infra in while
  # preserving the fork's changed keys (BASE = template@last-synced sha, per FT-5b). E0/T1.
  - { glob: "gradle.properties",             owner: merge, strategy: properties-3way }
  - { glob: "build.gradle.kts",              owner: template }
  # Per-fork derived files the template also ships — each fork's copy is computed from ITS OWN inputs,
  # so the template's copy is wrong for every fork. `fork` (not `generated`): the engine's exclusion
  # check preserves only fork-owned paths, so a `generated` file under a sync root would still be
  # overwritten. (2026-10-31 ownership audit + a field-officer dry-run sync, where yarn.lock and the
  # rendered legal output were being replaced with the template's.)
  - { glob: "kotlin-js-store/yarn.lock",     owner: fork }   # the fork's own npm dependency graph (kotlinUpgradeYarnLock)
  - { glob: "legal/output/**",               owner: fork }   # rendered from the fork's legal/*/template.md by legal/generate.sh
  - { glob: "kotlin-js-store/**",            owner: template }
  - { glob: "legal/**",                      owner: template }
  # .swiftpm-locks — per-fork SwiftPM resolution state (Package.resolved + generated module maps,
  # most of it already gitignored). It is BUILD OUTPUT keyed to the fork's own dependency graph,
  # not template code, so syncing it would push one fork's resolution onto another. It had no rule
  # and, once the catch-all flipped template-first, began resolving `template` — the one place that
  # flip needed an explicit answer rather than the default.
  - { glob: ".swiftpm-locks/**",             owner: fork }
  - { glob: "tests/**",                      owner: template }   # test harness — E0/T1 (closes the classification gap)
  # tools/*-ksp — the template's OWN codegen engine (store / database / network / data processors
  # that generate AppStoreRegistry, AppDatabase and the Generated*Bindings from the @StoreProvider /
  # @DbEntity / @ApiBinding / @RepositoryBinding annotations). A fork does not author these.
  # They had NO rule at all and fell to the `fork` DEFAULT, so they never synced — leaving every
  # fork frozen on the processor version it forked with while the annotations kept evolving. A
  # fork cannot be told "your registrations are generated for you" and then never receive the
  # generators. Added to SYNC_DIRS at the same time: ownership alone would not deliver them.
  - { glob: "tools/**",                      owner: template }
  # .bundle/config — BUNDLE_PATH for the vendored Ruby toolchain, template build infra. Same
  # story: no rule, so it defaulted to fork and never reached a consumer.
  - { glob: ".bundle/**",                    owner: template }
  - { glob: "META-INF/**",                   owner: template }
  # Repository community files — the code of conduct, contributing guide, licence and security
  # policy. They belong to the REPOSITORY (often its org: the CLA bot and org-wide SECURITY.md
  # commits land straight in each repo), never to the template, so a sync never writes them. They
  # were `owner: template`, and the field-officer sync replaced the app's own Contributing.md and
  # LICENCE (MPL-2.0 + "Copyright 2024 Mifos Initiative") with the template's (2026-11-03).
  # The org's devops/security teams set them up per repository. Who may EDIT each one is declared per
  # file — app-profile/app.yaml#repo_files.files.<file> (access: read|write, writers: [logins]),
  # overridden by the framework workspace's _org/company.yaml#repo_files.<file>. Absent → read (locked).
  # The globs match both spellings a repo may already use (Contributing.md, LICENCE, LICENSE.md).
  - glob: "CODE_OF_CONDUCT.md"
    owner: fork
    strategy: repo-files
  - glob: "C[Oo][Nn][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Nn][Gg].md"
    owner: fork
    strategy: repo-files
  - glob: "LICEN[CS]E*"
    owner: fork
    strategy: repo-files
  - glob: "SECURITY.md"
    owner: fork
    strategy: repo-files
  # The structural-migration record forks consult. Declared owner: template in its own header but
  # was in no SYNC list, so no fork ever received it (2026-10-31 ownership audit).
  - { glob: "template-migrations.yaml",      owner: template }
  # The template's OWN backend (its Supabase project). A fork has its own server, so this is
  # fork-owned territory everywhere — and is not a sync root.
  - { glob: "supabase/**",                   owner: fork }

  # ── default: any path not matched above — TEMPLATE-FIRST ──
  # This repo IS the template, so the default answer to "who owns this?" is the template. FORK
  # territory is declared EXPLICITLY above (`core/**`, `feature/**`, `app-profile/**`, the per-platform
  # branding carve-outs), never inferred from silence.
  #
  # This was `fork` — "never clobber an unknown fork file". That is the right default for a CONSUMER
  # and the wrong one for a template: a directory the template ADDS that nobody writes a rule for
  # silently becomes fork-owned and never syncs to anyone. `tools/**` (the KSP processors every
  # @StoreProvider / @DbEntity / @ApiBinding depends on) and `.bundle/**` both sat in exactly that
  # state — unowned AND unreachable, so no fork ever received a processor update.
  #
  # Flipping is safe BECAUSE fork territory is explicitly claimed: a fork's new
  # `core/store/.../quests/QuestStore.kt` or `feature/quests/**` resolves `fork` through its module
  # catch-all, not through this rule. Verified at the time of the change — all 2712 tracked files
  # matched an explicit rule, so ZERO existing paths changed owner.
  #
  # `--verify` still flags anything reaching this rule: relying on the default is a missing
  # classification either way, and the point is that the FAILURE MODE is now "a fork receives
  # template code it did not ask for" (visible, fixable) rather than "a fork silently never receives
  # template code at all" (invisible, permanent).
  #
  # SYNC ROOTS (2026-10-31). The template can only own what it SHIPS: a path that reaches this rule
  # but sits under NO sync root (scripts/white-label/sync-dirs.sh SYNC_DIRS / SYNC_FILES — the one
  # list, read by the resolver, never duplicated here) is fork territory and resolves `fork`. The
  # engine never touched such paths anyway; the resolver used to CALL them template, so an audit (or a
  # strict mirror) would have read a fork's `libs/`, `branding/`, `maestro/`, `server-layer/` as
  # template-owned and slated them for deletion. Measured across 10 forks: 156 fork-authored files.
  - glob: "**"
    owner: template
    default: true
