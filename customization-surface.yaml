# customization-surface.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Fork-ownership contract for kmp-project-template.
#
# A fork of this template runs `scripts/white-label/sync-dirs.sh` to pull template updates while
# keeping its own branding + features. This file is the SINGLE declared source of
# truth for "who owns this path?" — replacing the ownership knowledge previously
# scattered across scripts/white-label/sync-dirs.sh (SYNC_DIRS + EXCLUSIONS), scripts/white-label/fork-init.sh, and the
# syncForkConfig copy map.
#
# Every path resolves to exactly one owner:
#
#   template — the template is the SOLE author. `scripts/white-label/sync-dirs.sh` OVERWRITES the fork's
#              copy. A fork edit here is drift and will be clobbered — a genuine fix
#              belongs UPSTREAM as a PR to openMF/kmp-project-template.
#
#   fork     — the fork is the SOLE author. sync NEVER touches it (branding, demo,
#              the core/store seam, generated Config.xcconfig, local flavors, icons,
#              store listings, fork identity).
#
#   merge    — BOTH author. sync must do a 3-way MERGE, never a blind copy. This is
#              where the "fork permissions silently dropped on sync" class lives:
#              AndroidManifest.xml is template-shipped AND fork-extended.
#
# Precedence: FIRST matching rule wins. Rules are ordered most-specific → most-
# general, so the narrow `merge`/`fork` carve-outs win over the broad `template`
# module globs that follow them.
#
# Glob syntax: `*` matches within one path segment; `**` matches across segments;
# `**/x` matches `x` at any depth (including the root).
#
# Coverage is enforced by `scripts/customization-surface.sh --verify` (CI): every
# tracked path must match a NON-default rule, so a new template file can never land
# unclassified and silently clobber a fork later.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# Path-ownership rules, evaluated FIRST-MATCH-WINS, in file order (see "Precedence" above — this line
# said LAST-MATCH-WINS until 2026-10-31, which contradicted both the header and the engine, and
# would lead anyone trusting it to put a new narrow rule BELOW the broad one it must beat).
# Each rule declares owner (template | fork | merge) and, for merge, the strategy. The default
# is template-first (`**` → template), so fork territory is claimed explicitly — a path no rule
# names resolves to template, which is why a new fork-owned directory needs a rule here before
# the next sync overwrites it.
rules:
  # ── Test fixtures — FIRST, so no content-shaped rule below can claim them ──
  # A fixture mimics a real tree, so its paths match rules written for real code: `**/demo/**`
  # resolved canary fixtures `demo-showcase` and `**/composeResources/**/strings.xml` resolved them
  # `merge`, and the sync never delivers either class to a fork that lacks them. Measured 2026-11-02 on
  # mifos-x-field-officer-app: 8 fixture files dropped, so compose-strings-apostrophe-canary and
  # secrets-needs-generated-canary failed in the fork while passing in the template. A fixture is the
  # template's test code, whatever its path looks like.
  - glob: "scripts/product-health/tests/**"
    owner: template
  # ── DEMO feature modules — declared before the merge-required globs below ──
  # Same first-match accident as core-base. The repo-wide `**/composeResources/**/strings.xml → merge`
  # rule below claims 280 strings.xml across the 14 DEMO feature modules (loans, bills, rates, …),
  # while everything else in those same modules — their Kotlin, their build.gradle.kts — resolves
  # `fork`. One module, two answers, and the strings half was never reachable anyway: demo modules are
  # NOT in SYNC_DIRS (only the home/profile/settings BACKBONE is) and `remove-demo.sh --clean` deletes
  # them outright. So the contract promised to sync 280 files the engine cannot fetch and the
  # customizer will delete.
  #
  # Every feature module, the home/profile/settings/onboarding starters included, is the fork's — its
  # strings and its manifest follow the module. The repo-wide manifest rule below would otherwise claim
  # every feature's manifest (a starter's, and any feature a fork authors) for a merge the engine never
  # runs: no feature module is a sync root.
  - glob: "feature/**/composeResources/**/strings.xml"
    owner: fork
  - glob: "feature/**/AndroidManifest.xml"
    owner: fork

  # ── core-base is FRAMEWORK-SHARED — declared before the merge-required globs below ──
  # `core-base/**` resolves `template` further down, but the two merge-required rules that follow
  # are repo-WIDE (`**/AndroidManifest.xml`, `**/composeResources/**/strings.xml`) and first-match
  # wins, so without this they capture 22 core-base paths: core-base/ui's own 21-locale i18n and the
  # core-base/{common,observability} module manifests.
  #
  # Those globs exist so a FORK can union its own permissions and strings into files it legitimately
  # extends — its app module, its features, its core/* packages. core-base is not one of those: it is
  # framework-shared, a fork does not touch it, and 3-way merging the framework's own translations
  # invites a fork to accumulate edits in a tree that upgrades wholesale. Declaring it template here
  # keeps `core-base/**` exactly copy-and-replace, which is what it has always meant.
  - glob: "core-base/**/composeResources/**/strings.xml"
    owner: template
  - glob: "core-base/**/AndroidManifest.xml"
    owner: template

  # The feature starters (home/profile/settings) are the FORK's foundation — shipped once, never synced
  # (not in SYNC_DIRS). Declared here, above the repo-wide manifest/strings merge rules, so those do not
  # claim the starters' files for a merge the engine can never reach (sync-coverage-reconcile CL-1).
  - glob: "feature/home/**"
    owner: fork
  - glob: "feature/profile/**"
    owner: fork
  - glob: "feature/settings/**"
    owner: fork

  # ── merge-required (declared FIRST — must win over the template module globs) ──
  # AndroidManifest: template ships the base manifest; forks add permissions
  # (RECORD_AUDIO, FOREGROUND_SERVICE_*, etc). A blind copy DROPS the fork's — the
  # exact loss class this contract exists to close.
  - glob: "**/AndroidManifest.xml"
    owner: merge
    strategy: manifest-union
  # String resources: template base keys + fork-added keys must union.
  - glob: "**/composeResources/**/strings.xml"
    owner: merge
    strategy: strings-union
  # Version catalog: fork pins versions + adds libs; template adds/bumps. Already a
  # 3-way merge in scripts/white-label/sync-dirs.sh STEP 4.5 — declared here so the ownership is explicit.
  - glob: "gradle/libs.versions.toml"
    owner: merge
    strategy: catalog-3way
  # Settings: fork includes its own :feature:* modules; template adds core modules.
  - glob: "settings.gradle.kts"
    owner: merge
    strategy: include-union
  # Fork-owned settings-include seam (B1/T11). A fork adds its module includes HERE; the template
  # settings.gradle.kts applies it via `apply(from = ...)` and stays full-copy / include-union.
  - glob: "settings.local.gradle.kts"
    owner: fork
  # Template-sync version marker: records the template commit this fork last synced from. Written by
  # scripts/white-label/sync-dirs.sh on every sync, so it is FORK-OWNED — a template dir-copy must
  # never overwrite a fork's own last-synced pointer with the template's.
  - glob: ".template-version"
    owner: fork
  # The fork's navigation seam package (see the registry block further down for what it holds). It has to
  # come BEFORE the cmp-navigation merge rules: rules are first-match-wins, so a fork file such as
  # registry/app/navigation/RootNavGraph.kt otherwise matched `RootNav*.kt` / `*Navigation*.kt` below and
  # a sync tried to 3-way merge code the template never shipped.
  - glob: "cmp-navigation/**/registry/**"
    owner: fork
  # Root navigation host: template owns the scaffold; forks wire feature routes in.
  - glob: "cmp-navigation/**/*Navigation*.kt"
    owner: merge
    strategy: kotlin-3way
  - glob: "cmp-navigation/**/RootNav*.kt"
    owner: merge
    strategy: kotlin-3way
  # Nav DI + tab registry: template ships the base graph; forks add their feature
  # modules + bottom-nav tabs. Blind copy drops them (the awaazly 2026-07-19 loss class).
  - glob: "cmp-navigation/**/di/*.kt"
    owner: merge
    strategy: kotlin-3way
  - glob: "cmp-navigation/**/*TabItem*.kt"
    owner: merge
    strategy: kotlin-3way
  # Room database registry (E1/C7 — was the LAST hand-merged file under core/**).
  # AppDatabase.kt has NO row — deliberately. It was the LAST hand-merged file under core/,
  # because Room needs ONE compile-time `entities = [...]` literal and a fork's tables could not live
  # in a separate file the way every other seam works. It is now GENERATED WHOLE by
  # `tools/database-ksp` from the `@DbEntity` / `@DbDao` / `@DbConverters` annotations into
  # `build/generated/ksp/`, so there is no committed file for a sync to copy, merge, or own — and
  # re-adding a row would be a dead glob (`--verify` zero-match). Generating the literal removed the
  # merge rather than arbitrating it.
  # Fork-owned Room migration LEDGER — where each template migration unit landed in THIS fork's
  # version sequence, plus the fork's own migrations. owner:fork is load-bearing, not tidiness: the
  # template's ledger says v13, a fork's may say v27, and blind-copying ours over theirs would strand
  # every installed device on a version with no path forward.
  # Template-owned counterpart to the ledger: WHAT the template may add, with no version numbers.
  # Full-copies, because a fork never edits it — its answer goes in the fork-owned ledger below.
  # Framework tables, declared by the module that owns them. Template-owned: a fork that edited
  # these would break core-base at runtime. A fork's OWN tables are not declared in YAML at all —
  # they are `@DbEntity`-annotated classes, which is why this file has no fork counterpart.
  - glob: "core-base/database/module-schema.yaml"
    owner: template
  # Per-module package lifecycle, declared next to the code it describes. TEMPLATE-ONLY and
  # full-copying — the same split that took migration-units.yaml out of the `owner: merge` app.yaml,
  # so a template package addition is never a 3-way merge against a fork's edit.
  - glob: "core/*/module-packages.yaml"
    owner: template
  - glob: "core/database/migration-units.yaml"
    owner: template
  - glob: "app-profile/migration-ledger.yaml"
    owner: fork
  # The fork's half of module-packages.yaml: what it did to the template's declared packages
  # (removed / kept / absent). app.yaml documented it as `owner: fork, never synced`, but no rule
  # claimed it, so it resolved `template` — a sync would replace it and a strict mirror delete it.
  - glob: "app-profile/package-ledger.yaml"
    owner: fork
  # WHOLE-FILE generated => owner:fork, the same call as GeneratedApiBindings. These are derived in
  # full from the fork's app-profile (DB filename from its appId; schema version from its ledger), so
  # a sync has nothing to contribute and blind-copying the template's values over a fork's is pure
  # loss until the next syncForkConfig. Contrast the network `config/**` files, which are owner:
  # template because only a SENTINEL REGION inside them is generated — the file itself is template
  # content. The rule is: whole-file generated -> fork; region-generated -> template.
  - glob: "**/core/database/**/config/DatabaseConfig.kt"
    owner: fork
  - glob: "**/core/database/**/config/ForkDatabaseConfig.kt"
    owner: fork
  # Fork-owned DB schema version (GENERATED from the ledger). PRESERVED.
  - glob: "**/core/database/**/ForkDatabaseConfig.kt"
    owner: fork
  # Room exported schema JSONs (core/database/schemas/**/N.json) evolve per-fork: a fork adds entities
  # + bumps the version in its own migration ledger, producing its OWN schema files at higher
  # versions. sync-dirs.sh
  # blind-preserves `*/schemas/*`; this rule makes the ownership contract agree (owner:fork), so a synced
  # template never clobbers a fork's schema history.
  - glob: "**/schemas/**"
    owner: fork
  # Android FileProvider paths: template ships base <paths>; forks add feature paths
  # (exports/recordings/imports). Blind copy drops them → runtime FileProvider crash.
  - glob: "**/res/xml/provider_paths.xml"
    owner: merge
    strategy: xml-union
  # App entry point: template ships the base Activity; forks wire app-init/SDK hooks.
  - glob: "**/MainActivity.kt"
    owner: merge
    strategy: kotlin-3way
  # Android app build script: template updates plugins/config; forks add deps + flavors.
  # Merge (conflicts surface) beats a blind overwrite that silently drops every fork dep.
  - glob: "cmp-android/build.gradle.kts"
    owner: merge
    strategy: kotlin-3way
  # Android Application class: template ships the base Application; forks wire app-init/SDK
  # hooks (Koin start, crash reporting, deep-link handlers). Merge so a template update never
  # drops them. S4 classification gap — was owner GAP (ForkInitializers seam lands in E1).
  - glob: "**/AndroidApp.kt"
    owner: merge
    strategy: kotlin-3way
  # Nav module build script: template updates plugins/config; forks add their feature-module
  # dependencies. Merge (conflicts surface) beats a blind overwrite that drops fork feature deps.
  # S7 classification gap — was owner GAP (feature-deps.gradle.kts seam lands in E1).
  - glob: "cmp-navigation/build.gradle.kts"
    owner: merge
    strategy: kotlin-3way
  # Fork-owned feature-dependency seam (S7/F4). A fork adds/removes feature-module deps HERE; the
  # template-owned cmp-navigation/build.gradle.kts applies it via `apply(from = ...)` and stays full-copy.
  # This closes the S7 gap where a fork had to edit the template build file to add a feature. (E1/T8, 2026-08-11)
  - glob: "feature-deps.gradle.kts"
    owner: fork
  # Authenticated bottom-nav ViewModel: template ships the base tab graph; forks add tabs.
  # Merge so a template update never drops fork-added tabs. S6 classification gap — was owner
  # GAP (ForkTabRegistry seam lands in E1). Matches AuthenticatedNavbarNavigationViewModel.kt.
  - glob: "cmp-navigation/**/*NavbarNavigationViewModel.kt"
    owner: merge
    strategy: kotlin-3way

  # ── fork-owned (carve-outs INSIDE otherwise-template dirs; declared before template) ──
  # app-profile/ — the fork-owned white-label deployment SoT (identity, text, media, icons, per platform).
  # This is the ONLY fork-owned deployment surface. deployment/ LOGIC stays template-owned and reads this
  # via _shared/config.rb (AppProfile.get) + syncForkConfig.
  # (branding/icons was dissolved into app-profile/icons — there is no separate branding/ dir.)
  #
  # OWNERSHIP SPLIT (WS02, RULE-TEMPLATE-MODULE-FIX-UPSTREAM-001 / epic AC6): the STRUCTURED yaml config
  # (app.yaml + platforms/<p>/*.yaml + deploy-targets.yaml) is now owner: merge / strategy:
  # yaml-schema-merge — a 3-way merge built on the FORK's file: every fork value, comment and fork-only
  # key stays; the template adds its new keys, demo access-points and the defaults the fork never
  # changed (see scripts/customization-surface.sh#cs_merge_yaml_schema). The blind
  # `app-profile/** → owner: fork` glob is GONE — it blind-preserved the whole surface, so a fork never
  # received a freshly-added template key / demo access-point (schema silently skewed, RESEARCH F3).
  # Questionnaire CONTENT (**/app-content/** — read by their own consumers, EXCLUDED from AppProfile._data),
  # binary MEDIA (**/media/**), icons, and store-content json/md have no schema to evolve → stay owner: fork.

  # app-content questionnaire answers — fork-authored, NOT identity config (config.rb rejects /app-content/
  # from the merged _data). Declared FIRST so it wins over the platforms/**/*.yaml merge rule below.
  - glob: "app-profile/**/app-content/**"
    owner: fork
  # structured yaml config — 3-way on the fork's file (fork keeps what it wrote; template adds what is new)
  # key-ownership schemas (`<file>.schema.yaml`) — the template's rules for merging the yaml beside them
  - glob: "app-profile/**/*.schema.yaml"
    owner: template
  - glob: "app-profile/app.yaml"
    owner: merge
    strategy: yaml-schema-merge
  - glob: "app-profile/platforms/**/*.yaml"
    owner: merge
    strategy: yaml-schema-merge
  - glob: "app-profile/deploy-targets.yaml"
    owner: merge
    strategy: yaml-schema-merge
  # binary media / icons / store-content json + md — no schema to evolve, blind-preserved owner: fork
  - glob: "app-profile/icons/**"
    owner: fork
  - glob: "app-profile/platforms/**/media/**"
    owner: fork
  - glob: "app-profile/platforms/**/*.json"
    owner: fork
  - glob: "app-profile/README.md"
    owner: fork
  # feature backbone (E1 / F1) — home/profile/settings are the TEMPLATE-owned minimal SHELL every fork
  # keeps and receives upstream fixes for. Declared ABOVE the blanket `feature/** → fork` (first-match
  # wins). Their INNER content is fork-owned via two distinct seams: (a) the `*Body` vals in the
  # fork-owned ForkBackboneRegistry (cmp-navigation/**/registry — home/settings/profile inner content), and
  # (b) demo showcases under `feature/**/demo/**` which are the DISTINCT `demo-showcase` class below.
  #
  # DEMO-SHOWCASE vs FORK (WS01 / epic AC8, LD3a): a demo showcase is template-SHIPPED (demo-only,
  # updatable on sync) — a DIFFERENT ownership class from an arbitrary fork-added feature (which sync
  # must NEVER touch). Before this split both funneled into `feature/** → fork`, indistinguishable
  # except by the fence glob, so sync could not tell a showcase from a fork's own feature. Declared
  # FIRST so the backbone template rules never capture a `**/demo/**` package. An arbitrary
  # `feature/<x>` a fork authors is consumer-owned and falls through to the blanket `feature/** → fork`.
  - glob: "feature/**/demo/**"
    owner: demo-showcase
  # ── BACKBONE STARTERS — fork-owned, so a fork can redesign them freely ────────────────────────
  # home / profile / settings ship as a WORKING starting point and the fork owns them outright: it
  # redesigns the screens in place, using the shipped code as the base, and a sync never overwrites
  # that work. (They were `owner: template` with `ForkBackboneRegistry`'s homeBody/settingsBody/
  # profileBody as the only sanctioned edit point. That kept upstream fixes flowing, but it meant a
  # fork editing HomeScreen.kt directly — the obvious thing to do — silently lost the change on the
  # next sync. Ownership now matches what a fork actually does.)
  #
  # The seams still exist and still work; they are simply no longer the ONLY way in.
  #
  # THE TRADE, stated plainly: these modules no longer receive upstream fixes. That is the cost of
  # owning them, and it is deliberate.
  #
  # No carve-out: the starters are the app's FOUNDATION, handed over once. The template ships them for a
  # new fork to start from; it does not sync them afterwards (they are not in SYNC_DIRS), so every file
  # in them, the Platform.*.kt shims included, is the fork's to keep or change.
  - glob: "feature/home/**"
    owner: fork
  - glob: "feature/profile/**"
    owner: fork
  - glob: "feature/settings/**"
    owner: fork
  - glob: "feature/**"
    owner: fork
  # core/store seam — the 4 seam files below are fork-authored (white-label-template-completion E0/T1, LD-2).
  # The rest of core/store is template architecture (infra/, di aggregators) that MUST receive upstream fixes.
  # The demo showcase stores NO LONGER live under core/store/**/demo/**: they are per-domain packages
  # declared in app-profile/app.yaml#core_store.packages[], so they need explicit globs below rather
  # than falling through to the generic `**/demo/**` rule.
  # core/store fork seams — the `Fork*` files a fork edits. The sync never touches them, so a
  # fork's error copy and branding survive; everything they extend lives in config/ and IS synced.
  # These were previously the template files themselves (KptErrorMapper / KptScreenStateDefaults
  # marked owner:fork because each carried a `TODO(fork)` extension point inside it), which meant a
  # fork that customised one branch stopped receiving upstream fixes to the whole file.
  - glob: "core/store/**/ForkErrorMapper.kt"
    owner: fork
  - glob: "core/store/**/ForkScreenStateDefaults.kt"
    owner: fork
  # The template's definition surface — full-copied on a sync so forks get upstream improvements.
  - glob: "core/store/**/config/KptErrorMapper.kt"
    owner: template
  - glob: "core/store/**/config/KptScreenStateDefaults.kt"
    owner: template
  # AppStoreRegistry.kt / AppCacheKeys.kt / GeneratedStoreBindings.kt have NO row — deliberately.
  # They were `owner: fork` while syncForkConfig wrote them into committed source. They are now KSP
  # BUILD ARTIFACTS emitted from the `@StoreProvider` / `@CacheKey` annotations into
  # `core/store/build/generated/ksp/…`, so there is no committed file for a sync to copy, merge, or
  # own. Re-adding a row would be a dead glob (`--verify` zero-match) — the declaration IS the
  # annotation on the provider fn, and that provider file is already covered by the rows below.
  # StoreModule.kt is TEMPLATE-owned again. It used to be owner:fork because ~30 hand-written store
  # bindings lived in it, which meant a fork never received upstream fixes to the framework wiring
  # it also contains (CoreBaseStoreModule, StoreCacheManager, DraftInventory). With the bindings
  # generated into GeneratedStoreBindings, nothing fork-specific is left and a sync can full-copy it.
  - glob: "core/store/**/di/KptStoreModule.kt"
    owner: template
  # core/store demo showcases — the DISTINCT `demo-showcase` class: template-SHIPPED, demo-only,
  # updatable on sync, and deleted by `remove-demo.sh --clean` per their `owner: template` row in
  # app-profile/app.yaml#core_store.packages[]. Listed explicitly because the packages moved out of
  # `demo/` (an earlier revision removed globs like `core/store/economic/**` as dead — they matched
  # nothing while the stores sat under demo/; the move makes them live again, and demo-showcase is
  # the correct class for them, not `template`).
  # Demo packages per module — read from core/<module>/module-packages.yaml (`demo:` ids), not
  # restated here. Each id becomes core/<module>/**/kpt/core/<module>/<id>/** → demo-showcase.
  - packages: module-packages
  # Demo-showcase cache keys — split out of the template-owned AppCacheKeys (E1/C5) and declared
  # for deletion via app.yaml#core_store.template_files[].
  # White-label registry seams — the fork-owned extension package (cmp.navigation.registry). The
  # template infra (KoinModules, AuthenticatedNavigation, the navbar screen, cmp-shared's initKoin,
  # feature/home's HomeScreen shell) READS these seams; a fork adds/removes features, tabs, the home
  # body, and startup hooks by editing ONLY files here, so the infra modules stay full-copy
  # `owner: template`. Covers ForkFeatureRegistry (routes+DI), ForkBackboneRegistry (home body, S5),
  # ForkTabRegistry (bottom-nav tabs, S6), ForkInitializers (startup hooks, S3/S4) + the package README.
  # The whole package is the seam — same pattern as the core/store block above. (E1/T7, 2026-08-11)
  #
  # Base-feature INNER-content seam (WS01 / epic AC7): ForkBackboneRegistry carries the fork-owned
  # `homeBody` / `settingsBody` / `profileBody` `val`s. These remain a supported way to supply the
  # backbone's inner content WITHOUT touching the module — useful when a fork wants the shipped shell
  # to keep evolving around its own body.
  #
  # It is no longer the ONLY way in: `feature/{home,profile,settings}/**` is now `owner: fork`, so a
  # fork may equally redesign those screens in place. The seam suits a fork that wants to swap content
  # and leave the shell alone; direct ownership suits a fork that wants the whole surface.
  - glob: "cmp-navigation/**/registry/ForkBackboneRegistry.kt"
    owner: fork
  - glob: "cmp-navigation/**/registry/**"
    owner: fork
  # Worker seam — the fork-owned @WorkerKmpWorkers site (cmp-shared). The template WorkerDeclarations.kt
  # (base workers) stays owner:template; the KSP processor aggregates both. A fork declares its workers
  # here, so a sync full-copies cmp-shared while the fork's workers survive.
  - glob: "cmp-shared/**/ForkWorkerDeclarations.kt"
    owner: fork
  # demo showcase stores/data — the DISTINCT `demo-showcase` class (WS01 / epic AC8). Covers
  # core/store/**/demo/{economic,banking,…} (the demo Store5 showcases) + every other **/demo/**
  # package: template-SHIPPED, demo-only, updatable on sync — NOT the same class as a fork-added
  # feature (`feature/** → fork`). The former dead globs `core/store/economic/**` +
  # `core/store/banking/**` claimed `template` but matched ZERO real paths (the stores live under
  # demo/), so they mis-declared ownership — removed (E0/T3).
  # GeneratedApiBindings.kt has NO row — it is a BUILD ARTIFACT now, derived from `@ApiBinding` on
  # the API types into `build/generated/ksp/`. It was `owner: fork` while syncForkConfig wrote it
  # into committed source, because it was generated from the FORK's app-profile and a sync would
  # otherwise have blind-copied the template's bindings over a fork's. (It deliberately did NOT live
  # under demo/: remove-demo.sh deletes every `**/demo/**` package, which silently killed the codegen
  # for any cleaned fork.)
  - glob: "**/demo/**"
    owner: demo-showcase
  # The fork's preferences EXTEND the framework's: ForkPreferencesRepository inherits
  # UserPreferencesRepository and its impl delegates to the template's, so a fork gets every
  # framework preference for free, adds its own, and overrides any it needs to alter. The template's
  # two files stay hand-managed and full-copy; these two are never synced. No declaration drives it —
  # inheritance makes "a framework preference cannot be removed" a compile error rather than a rule.
  - glob: "**/core/datastore/**/ForkPreferencesRepository.kt"
    owner: fork
  - glob: "**/core/datastore/**/ForkPreferencesRepositoryImpl.kt"
    owner: fork
  # Fork DI seams — `di/Fork<X>Module.kt` is the "yours to fill" per-layer seam (network, store,
  # data, database). WLS-1..4 keep it alive through `remove-demo.sh`; ownership is what keeps it alive
  # through a SYNC. As owner:template the template's EMPTY seam blind-copies over a fork's filled-in
  # one on every sync — the same silent-loss class as AndroidManifest, and it defeats the entire point
  # of the seam. Symmetric with `cmp-shared/**/ForkWorkerDeclarations.kt` above. Enforced by WLS-5
  # (`scripts/product-health/checks/white-label-di-seams.sh`).
  # Declared AFTER `**/demo/**` on purpose: a Fork*Module stranded under demo/ is a WLS-2
  # violation and must keep classifying as demo-showcase, not silently become fork-owned.
